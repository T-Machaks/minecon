name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Package server source (no node_modules)
        run: tar -czf server-src.tar.gz --exclude='server/node_modules' server/

      - name: Upload server source to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'server-src.tar.gz'
          target: '/home/ec2-user/'

      - name: Upload frontend dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'dist/*'
          target: '/home/ec2-user/minecon-dist'
          strip_components: 1

      - name: Deploy API + activate frontend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 180s
          script: |
            set -e

            # Extract server source over existing minecon-server/
            mkdir -p /tmp/minecon-deploy
            tar -xzf /home/ec2-user/server-src.tar.gz -C /tmp/minecon-deploy
            cp -r /tmp/minecon-deploy/server/. /home/ec2-user/minecon-server/
            rm -rf /tmp/minecon-deploy /home/ec2-user/server-src.tar.gz

            # Reinstall server deps + restart API
            cd /home/ec2-user/minecon-server
            npm ci --omit=dev
            pm2 restart minecon-api

            # Activate frontend on nginx
            sudo cp -r /home/ec2-user/minecon-dist/* /usr/share/nginx/minecon/
            sudo chmod -R a+rX /usr/share/nginx/minecon/
            sudo restorecon -r /usr/share/nginx/minecon/ 2>/dev/null || true
            rm -rf /home/ec2-user/minecon-dist

            echo "Deploy complete"
