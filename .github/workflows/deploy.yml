name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          script: |
            set -e
            cd /home/ec2-user/minecon

            # Pull latest server code
            git pull origin main

            # Install any new server dependencies
            cd server && npm ci --omit=dev && cd ..

            # Restart API (picks up server/* changes immediately)
            pm2 restart minecon-api

      - name: Copy built frontend to nginx
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'dist/*'
          target: '/tmp/minecon-dist'
          strip_components: 1

      - name: Activate frontend on nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo cp -r /tmp/minecon-dist/* /usr/share/nginx/minecon/
            sudo chmod -R 755 /usr/share/nginx/minecon/assets/
            sudo chcon -R -t httpd_sys_content_t /usr/share/nginx/minecon/
            rm -rf /tmp/minecon-dist
            echo "Deploy complete"
